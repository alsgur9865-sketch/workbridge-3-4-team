services:
  - type: web
    name: workbridge-api
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: buildCommand: npm ci --include=dev && npm run db:generate && npm run build:backend
    startCommand: npm run start --workspace @workbridge/backend
    healthCheckPath: /api/v1/health

    envVars:
      - key: NODE_VERSION
        value: 24

      - key: NODE_ENV
        value: production

      - key: FRONTEND_URL
        sync: false

      - key: DATABASE_URL
        sync: false

      - key: JWT_ACCESS_SECRET
        sync: false

      - key: JWT_REFRESH_SECRET
        sync: false